name: Validate ForestMesh
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.lock
      - run: npm --prefix frontend ci
      - run: scripts/check.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser demo
        run: |
          .venv/bin/uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break; sleep 1; done
          CHROMIUM_PATH=$(node -e "console.log(require('./frontend/node_modules/playwright').chromium.executablePath())") npm --prefix frontend run test:e2e
